name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            container:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'migrations/**'
              - 'templates/**'
              - 'static/**'
            worker:
              - 'worker/**'
              - 'wrangler.jsonc'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'

      - name: Skip if nothing deployable changed
        if: steps.filter.outputs.container != 'true' && steps.filter.outputs.worker != 'true'
        run: echo "No Worker or container inputs changed; skipping deploy."

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.container == 'true' || steps.filter.outputs.worker == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.filter.outputs.container == 'true' || steps.filter.outputs.worker == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.container == 'true'

      - name: Deploy Worker + container
        if: steps.filter.outputs.container == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Worker only
        if: steps.filter.outputs.container != 'true' && steps.filter.outputs.worker == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --containers-rollout=none
