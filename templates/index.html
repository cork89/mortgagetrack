{% extends "base.html" %}

{% block body %}
<header class="top-bar">
  <h1 class="brand">Mortgage Track</h1>
  <form class="account-chip" method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <span class="account-email" title="{{ user_email }}">{{ user_email }}</span>
    <button type="submit" class="btn-text">Sign out</button>
  </form>
</header>

{% include "partials/profile_bar.html" %}

<div id="main-panel">
  {% include "partials/dashboard.html" %}
</div>

{% include "partials/loan_popover.html" %}
{% include "partials/note_popover.html" %}
{% endblock %}
