<div class="panel-surface">
  <div class="panel-head">
    <div>
      <h2>Principal vs interest</h2>
      <span class="hint" id="chartHint">{{ chart.hint }}</span>
    </div>
    <div class="seg-toggle" role="group" aria-label="Chart period">
      <button type="button" data-grain="monthly"{% if chart.grain == "monthly" %} class="active"{% endif %}
        aria-pressed="{% if chart.grain == "monthly" %}true{% else %}false{% endif %}"
        hx-get="/partials/chart?grain=monthly&tab=chart"
        hx-target="#panel-chart"
        hx-swap="innerHTML show:none">Monthly</button>
      <button type="button" data-grain="yearly"{% if chart.grain == "yearly" %} class="active"{% endif %}
        aria-pressed="{% if chart.grain == "yearly" %}true{% else %}false{% endif %}"
        hx-get="/partials/chart?grain=yearly&tab=chart"
        hx-target="#panel-chart"
        hx-swap="innerHTML show:none">Yearly</button>
    </div>
  </div>
  <div class="chart-wrap" id="chartWrap">
    <div class="chart-legend">
      <span class="l-principal">Principal</span>
      <span class="l-interest">Interest</span>
    </div>
    <div class="chart-tooltip" id="chartTooltip" role="tooltip"></div>
    <svg class="chart-svg" id="chartSvg" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"
      aria-label="Principal versus interest"
      data-buckets="{{ chart.buckets_json }}">
      {{ chart.svg|safe }}
    </svg>
  </div>
</div>
