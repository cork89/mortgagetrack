<div class="panel-surface">
  <div class="panel-head">
    <div>
      <h2>Principal vs interest</h2>
      <span class="hint{% if chart.grain != "monthly" %} hidden{% endif %}" data-grain-hint="monthly">{{ chart.monthly.hint }}</span>
      <span class="hint{% if chart.grain != "yearly" %} hidden{% endif %}" data-grain-hint="yearly">{{ chart.yearly.hint }}</span>
    </div>
    <div class="seg-toggle" id="chartGrainToggle" role="group" aria-label="Chart period">
      <button type="button" data-grain="monthly"{% if chart.grain == "monthly" %} class="active"{% endif %}
        aria-pressed="{% if chart.grain == "monthly" %}true{% else %}false{% endif %}">Monthly</button>
      <button type="button" data-grain="yearly"{% if chart.grain == "yearly" %} class="active"{% endif %}
        aria-pressed="{% if chart.grain == "yearly" %}true{% else %}false{% endif %}">Yearly</button>
    </div>
  </div>
  <div class="chart-wrap" id="chartWrap"
    data-monthly-buckets="{{ chart.monthly.buckets_json }}"
    data-yearly-buckets="{{ chart.yearly.buckets_json }}">
    <div class="breakdown-chart" id="breakdownChart"
      role="img"
      aria-label="Principal versus interest breakdown"></div>
  </div>
</div>
