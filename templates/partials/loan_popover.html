<div id="loanPopover" class="loan-popover" popover>
  <div class="popover-card">
    <div class="popover-head">
      <h2 id="popoverTitle">New profile</h2>
      <button type="button" class="popover-close" id="closePopoverBtn" aria-label="Close">×</button>
    </div>
    <form id="loanForm" method="post" action="/profiles" data-mode="create">
      <label class="name-field" id="nameFieldWrap">
        Profile name
        <input id="profileName" name="name" type="text" maxlength="60" placeholder="e.g. Primary home" autocomplete="off" />
      </label>
      <div class="inputs" id="loanFields">
        <label>
          Loan amount
          <input id="principal" name="principal" type="number" min="1" step="1" value="400000" />
        </label>
        <label>
          Interest rate (%)
          <input id="rate" name="rate" type="number" min="0" step="0.01" value="6.5" />
        </label>
        <label>
          Term (years)
          <input id="term" name="term" type="number" min="1" max="50" step="1" value="30" />
        </label>
        <label>
          First payment
          <input id="startDate" name="start_date" type="date" value="{{ default_start }}" data-default="{{ default_start }}" />
        </label>
      </div>
      <div class="extras-editor hidden" id="extrasEditor">
        <h3>Additional payments</h3>
        <p class="extras-empty" id="extrasEmpty">None yet — add them from the Payments tab.</p>
        <ul class="extras-list" id="extrasList"></ul>
      </div>
      <div class="actions">
        <button type="submit" class="btn-primary" id="buildBtn">Create profile</button>
        <span class="reset-wrap hidden" id="resetWrap">
          <button type="button" class="btn-ghost" id="resetPaidBtn">Clear tracked payments</button>
        </span>
        <span class="hint">Saved on the server</span>
      </div>
      <p class="error" id="error" role="alert">{{ error }}</p>
    </form>
  </div>
</div>
