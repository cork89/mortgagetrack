<div id="loanPopover" class="loan-popover" popover>
  <div class="popover-card profile-manager">
    <div class="popover-head">
      <h2 id="popoverTitle">Profiles</h2>
      <button type="button" class="popover-close" id="closePopoverBtn" aria-label="Close">×</button>
    </div>
    <div class="profile-manager-body">
      <aside class="profile-gutter" aria-label="Your profiles">
        <ul class="profile-gutter-list" id="profileGutterList"></ul>
        <div class="profile-gutter-actions" data-can-create="{% if can_create_profile %}true{% else %}false{% endif %}">
          <button type="button" class="profile-gutter-icon-btn" id="profileGutterNewBtn"
            aria-label="New profile"
            {% if !can_create_profile %}disabled title="Paid feature"{% else %}title="New profile"{% endif %}>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
          <button type="button" class="profile-gutter-icon-btn profile-gutter-copy hidden" id="copyProfileBtn"
            aria-label="Copy profile"
            {% if !can_create_profile %}disabled title="Paid feature"{% else %}title="Copy profile"{% endif %}>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
            </svg>
          </button>
          <button type="button" class="profile-gutter-icon-btn profile-gutter-delete hidden" id="deleteProfileBtn"
            aria-label="Delete profile" title="Delete profile">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </div>
      </aside>
      <form id="loanForm" class="popover-form profile-editor" method="post" action="/profiles" data-mode="create"
        hx-post="/profiles"
        hx-target="#error"
        hx-swap="outerHTML">
        <div class="popover-scroll">
          <label class="name-field" id="nameFieldWrap">
            Profile name
            <input id="profileName" name="name" type="text" maxlength="60" placeholder="e.g. Primary home" autocomplete="off" />
          </label>
          <div class="inputs" id="loanFields">
            <label>
              Loan amount
              <input id="principal" name="principal" type="number" min="1" step="1" value="400000" />
            </label>
            <label>
              Interest rate (%)
              <input id="rate" name="rate" type="number" min="0" step="0.01" value="6.5" />
            </label>
            <label>
              Term (years)
              <input id="term" name="term" type="number" min="1" max="50" step="1" value="30" />
            </label>
            <label>
              First payment
              <input id="startDate" name="start_date" type="date" value="{{ default_start }}" data-default="{{ default_start }}" />
            </label>
          </div>
          <label class="auto-mark-check" id="autoMarkDueWrap">
            <input type="checkbox" id="autoMarkDuePaid" name="auto_mark_due_paid" value="true" />
            Auto mark payments paid on/after their due date
          </label>
          <div class="share-editor hidden" id="shareEditor">
            <div id="sharePanel"></div>
          </div>
        </div>
        <div class="popover-footer">
          <div class="actions">
            <button type="submit" class="btn-primary" id="buildBtn">Create profile</button>
            <button type="button" class="btn-ghost hidden" id="openProfileBtn">Open</button>
            <span class="reset-wrap hidden" id="resetWrap">
              <button type="button" class="btn-ghost" id="resetPaidBtn">Clear tracked payments</button>
            </span>
          </div>
          <p class="error" id="error" role="alert">{{ error }}</p>
        </div>
      </form>
    </div>
  </div>
</div>
