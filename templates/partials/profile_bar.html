<section class="profile-bar{% if !has_profiles %} hidden{% endif %}" id="profileBar" aria-label="Profiles" data-is-owner="{% if is_owner %}true{% else %}false{% endif %}">
  <div class="profile-select-wrap">
    <span>Profile</span>
    <select id="profileSelect" name="profile_id" aria-label="Active profile"
      {% if !has_profiles %}disabled{% endif %}
      hx-post="/profiles/switch"
      hx-target="#main-panel"
      hx-swap="innerHTML"
      hx-include="this"
      hx-vals='js:{tab: new URLSearchParams(location.search).get("tab") || document.getElementById("dashboard")?.dataset.tab || "calendar", year: document.getElementById("dashboard")?.dataset.year, filter: document.getElementById("dashboard")?.dataset.filter || "all", grain: document.getElementById("dashboard")?.dataset.grain || "monthly"}'
      hx-trigger="change">
      {% if !has_profiles %}
      <option value="">No profiles yet</option>
      {% else %}
        {% for p in profiles %}
        <option value="{{ p.id }}"
          data-shared="{% if p.is_shared %}true{% else %}false{% endif %}"
          data-name="{{ p.name }}"
          data-principal="{{ p.principal }}"
          data-rate="{{ p.rate }}"
          data-term="{{ p.term_years }}"
          data-start="{{ p.start_date }}"
          data-auto-mark-due="{% if p.auto_mark_due_paid %}true{% else %}false{% endif %}"
          {% if p.selected %} selected{% endif %}>{% if p.is_shared %}{{ p.name }} (shared){% else %}{{ p.name }}{% endif %}</option>
        {% endfor %}
      {% endif %}
    </select>
  </div>
  <div class="profile-actions">
    <button type="button" class="btn-primary" id="manageProfilesBtn">Profiles</button>
  </div>
  <div class="profile-meta" id="profileMeta"{% match dashboard %}{% when None %} hidden{% else %}{% endmatch %}>
    {% match dashboard %}
    {% when Some with (d) %}
    <div class="profile-chip">
      <span class="label">Principal</span>
      <span class="value" data-field="principal">{{ d.profile_principal }}</span>
    </div>
    <div class="profile-chip">
      <span class="label">Rate</span>
      <span class="value" data-field="rate">{{ d.profile_rate }}</span>
    </div>
    <div class="profile-chip">
      <span class="label">Term</span>
      <span class="value" data-field="term">{{ d.profile_term }}</span>
    </div>
    {% else %}
    <div class="profile-chip">
      <span class="label">Principal</span>
      <span class="value" data-field="principal"></span>
    </div>
    <div class="profile-chip">
      <span class="label">Rate</span>
      <span class="value" data-field="rate"></span>
    </div>
    <div class="profile-chip">
      <span class="label">Term</span>
      <span class="value" data-field="term"></span>
    </div>
    {% endmatch %}
  </div>
</section>
